<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Gurushala VGT tote bag</title>
<desc id="desc">Cream tote bag with the Gurushala learning tree identity and colourful leaf accents.</desc>
<defs>
