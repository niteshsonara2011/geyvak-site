<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">UNNAHANA textile library</title><desc id="desc">Layered heritage-inspired textiles in ivory, indigo, rust and forest green.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf4e9"/><stop offset="1" stop-color="#dec7a8"/></linearGradient><pattern id="sprig" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M45 18v52M45 40c-18-20-31-10-30 6 17 3 27-3 30-6Zm0 13c18-20 31-10 30 6-17 3-27-3-30-6Z" fill="none" stroke="#9b5638" stroke-width="4" stroke-linecap="round"/><circle cx="45" cy="28" r="5" fill="#17392d"/></pattern><pattern id="paisley" width="140" height="140" patternUnits="userSpaceOnUse"><path d="M78 28c36 13 46 48 20 73-25 24-70 9-65-27 4-27 34-28 43-9 6 13-4 25-16 24" fill="none" stroke="#d5a66b" stroke-width="5"/><circle cx="74" cy="72" r="8" fill="#9b5638"/></pattern><pattern id="diamond" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M50 8 92 50 50 92 8 50Z" fill="none" stroke="#f3d4a7" stroke-width="5"/><path d="M50 25 75 50 50 75 25 50Z" fill="#17392d" opacity=".35"/></pattern></defs><rect width="1200" height="900" fill="url(#bg)"/><g transform="translate(520 80) rotate(3)"><rect width="580" height="250" rx="28" fill="#eee0c8" stroke="#c6a983" stroke-width="6"/><rect width="580" height="250" rx="28" fill="url(#sprig)"/></g><g transform="translate(430 255) rotate(-3)"><rect width="620" height="250" rx="28" fill="#152f34" stroke="#0e211c" stroke-width="6"/><rect width="620" height="250" rx="28" fill="url(#paisley)"/></g><g transform="translate(500 445) rotate(2)"><rect width="570" height="230" rx="28" fill="#a15432" stroke="#74361f" stroke-width="6"/><rect width="570" height="230" rx="28" fill="url(#diamond)"/></g><g transform="translate(395 620) rotate(-2)"><rect width="650" height="210" rx="28" fill="#273d2d" stroke="#18291d" stroke-width="6"/><rect width="650" height="210" rx="28" fill="url(#sprig)" opacity=".7"/></g><path d="M88 680c90-115 130-185 145-360 70 91 72 186 1 280-38 50-91 83-146 80Z" fill="#7f947d" opacity=".65"/><path d="M130 700c110-80 178-115 305-118" fill="none" stroke="#556c56" stroke-width="10" stroke-linecap="round"/><text x="80" y="105" font-family="Georgia,serif" font-size="72" letter-spacing="9" fill="#17392d">THE TEXTILE LIBRARY</text><text x="84" y="155" font-family="Arial,sans-serif" font-size="24" letter-spacing="7" fill="#9b5638">PATTERN · PLACEMENT · PROPORTION</text><text x="82" y="240" font-family="Georgia,serif" font-size="35" fill="#36473c">Stories held in colour, rhythm</text><text x="82" y="286" font-family="Georgia,serif" font-size="35" fill="#36473c">and the spaces left quiet.</text></svg>